# Builds the RecapAI Docker images on GitHub's servers and publishes them to GitHub Container Registry,
# so a Windows PC (or VPS) only has to DOWNLOAD them instead of building (no memory crashes, much faster).
#   ghcr.io/<owner>/myrecap-api:latest   ghcr.io/<owner>/myrecap-worker:latest   ghcr.io/<owner>/myrecap-web:latest
# Enable once from the repo folder on Windows:  .\windows\enable-cloud-build.ps1
name: Docker images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-images
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/myrecap-${{ matrix.target }}:latest
            ghcr.io/${{ steps.names.outputs.owner }}/myrecap-${{ matrix.target }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
